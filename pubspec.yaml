name: app_meteorologico
description: "Clima Brasil: previsão do tempo em Flutter com dados da Open-Meteo."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  provider: ^6.1.5+1
  geolocator: ^14.0.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/fontes/OFL.txt

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fontes/Outfit-Light.ttf
          weight: 300
        - asset: assets/fontes/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fontes/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fontes/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/Outfit-Bold.ttf
          weight: 700
